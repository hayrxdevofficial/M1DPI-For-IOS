name: M1DPI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "4F2K24VL24"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  M1DPI:
    type: application
    platform: iOS
    sources:
      - path: Sources/App          # <-- смотрим в App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.m1dpi
        INFOPLIST_FILE: Sources/App/Info.plist  # <-- и plist тоже в App
        GENERATE_INFOPLIST_FILE: "NO"