name: M1DPI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  M1DPI:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.m1dpi
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/M1DPI.entitlements
        GENERATE_INFOPLIST_FILE: "NO"          # ← ДОБАВИТЬ
    dependencies:
      - target: M1DPIExtension
        embed: true

  M1DPIExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.m1dpi.extension
        INFOPLIST_FILE: Sources/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extension/M1DPIExtension.entitlements
        GENERATE_INFOPLIST_FILE: "NO"          # ← ДОБАВИТЬ
    dependencies:
      - sdk: NetworkExtension.framework
